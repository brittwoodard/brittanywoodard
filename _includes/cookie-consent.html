<div id="cookieConsentBanner" class="p-2 bg-light m-2 md:w-[40%] fixed left-0 bottom-0 z-20">
  <div class="border border-dark bg-light p-6 relative">
    
    <div class="absolute top-2 right-2 cursor-pointer">
       <span id="close-cookie-banner" class="text-sm font-bold leading-none p-1 block hover:text-feature hover:border-feature transition duration-500">✕</span>
    </div>

    <div class="text-center mt-2 px-4">
      <p class="text-md">
        We value your privacy. With your consent, we use cookies to improve this space. 
        They load only after Accept.
      </p>
    </div>

    <div class="flex justify-center mt-4">
      <a id="acceptCookies" class="button-cookies cursor-pointer link">Accept</a>
      <a id="declineCookies" class="mx-4 button-cookies cursor-pointer link">Decline</a>
    </div>
  </div>
</div>

<script>
  const GTM_ID = 'GTM-MZSNJJTD'; // Your GTM Container ID

  function setCookie(name, value, days) {
    const maxAge = days * 24 * 60 * 60;
    document.cookie = `${name}=${value}; Path=/; Max-Age=${maxAge}; SameSite=Lax`;
  }

  function getCookie(name) {
    return document.cookie.split('; ').find(row => row.startsWith(name + '='))?.split('=')[1];
  }

  function loadGTM() {
    if (window.__gtmLoaded) return;
    window.dataLayer = window.dataLayer || [];
    window.dataLayer.push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' });

    const f = document.getElementsByTagName('script')[0];
    const j = document.createElement('script');
    j.async = true;
    j.src = 'https://www.googletagmanager.com/gtm.js?id=' + GTM_ID;
    f.parentNode.insertBefore(j, f);
    window.__gtmLoaded = true;
  }

  function handleConsent(status) {
    setCookie('cookiesConsent', status, 365);
    document.getElementById('cookieConsentBanner').style.display = 'none';
    if (status === 'accepted') loadGTM();
  }

  document.addEventListener('DOMContentLoaded', () => {
    const consent = getCookie('cookiesConsent');
    const banner = document.getElementById('cookieConsentBanner');

    if (consent === 'accepted') {
      loadGTM();
    } else if (!consent) {
      // Only show banner if no choice has been made yet
      banner.style.display = 'block';
    }

    document.getElementById('acceptCookies').onclick = () => handleConsent('accepted');
    document.getElementById('declineCookies').onclick = () => handleConsent('declined');
    document.getElementById('close-cookie-banner').onclick = () => handleConsent('declined');
  });
</script>
